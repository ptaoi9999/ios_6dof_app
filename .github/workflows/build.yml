name: Build Unsigned IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode version
      run: |
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
        xcodebuild -version

    - name: Cache SwiftPM dependencies
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('**/project.pbxproj') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Build App (Unsigned)
      run: |
        xcodebuild archive \
          -project ios_6dof_app.xcodeproj \
          -scheme ios_6dof_app \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/ios_6dof_app.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          COMPILER_INDEX_STORE_ENABLE=NO

    - name: Package IPA (Unsigned)
      run: |
        mkdir -p build/Payload
        cp -r build/ios_6dof_app.xcarchive/Products/Applications/ios_6dof_app.app build/Payload/
        cd build
        zip -r ios_6dof_app.ipa Payload
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios_6dof_app-unsigned-ipa
        path: build/ios_6dof_app.ipa
        if-no-files-found: error
